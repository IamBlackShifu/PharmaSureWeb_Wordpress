upstream wordpress {
    server wordpress:9000;
}

server {
    listen 80;
    server_name localhost *.localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # Logging
    access_log /var/log/nginx/wordpress-access.log main;
    error_log /var/log/nginx/wordpress-error.log warn;

    # Security headers
    # HSTS belongs on the production TLS listener or edge proxy, never this
    # local plain-HTTP listener (which would otherwise poison localhost).
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

    # Prevent direct access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /wp-admin/includes/ {
        deny all;
    }

    # Public CSS, JavaScript and fonts live under wp-includes. Block executable
    # PHP there without denying the static assets required by the admin bar and
    # block editor/frontend styles.
    location ~* ^/wp-includes/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # WordPress multisite rewrite rules
    if (!-e $request_filename) {
		rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 last;
		rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 last;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # XML RPC (optional, disable if not needed)
    location = /xmlrpc.php {
        access_log off;
        log_not_found off;
        deny all;
    }

    # PHP execution
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass wordpress;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 60;
        fastcgi_read_timeout 60;
		fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
    }

    # WordPress homepage and subdirectories
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
